<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Grazie per l'acquisto · I miei viaggi</title>
<link rel="icon" href="/itinerario/favicon-itinerario.svg" type="image/svg+xml">
<link rel="icon" href="/itinerario/favicon-itinerario.ico" sizes="any">
<link rel="apple-touch-icon" href="/itinerario/apple-touch-icon-itinerario.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Pagina di ritorno dopo il pagamento Stripe: stesso sistema di /itinerario */
:root{
  --bg:#fbf8f3; --panel:#f4efe6; --paper:#ffffff; --ink:#2c2825; --ink2:#44403c; --sub:#78716c;
  --line:#e7e5e4; --line2:#d6d3d1; --accent:#9a3412; --accent-h:#802a0e; --accent-bg:#fff1e6;
  --ok:#2f6b3a; --ok-bg:#e6f2ea; --warn:#8a6110; --warn-bg:#fbf1dc;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1817; --panel:#24211f; --paper:#2a2725; --ink:#f0ebe4; --ink2:#d6d0c8; --sub:#a8a29e;
  --line:#3a3633; --line2:#4a4542; --accent:#e0855a; --accent-h:#ec9a73; --accent-bg:#3a2a22;
  --ok:#8cc79a; --ok-bg:#1f2b22; --warn:#e2bd6a; --warn-bg:#2d2416; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1817; --panel:#24211f; --paper:#2a2725; --ink:#f0ebe4; --ink2:#d6d0c8; --sub:#a8a29e;
  --line:#3a3633; --line2:#4a4542; --accent:#e0855a; --accent-h:#ec9a73; --accent-bg:#3a2a22;
  --ok:#8cc79a; --ok-bg:#1f2b22; --warn:#e2bd6a; --warn-bg:#2d2416; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
h1,h2{font-family:var(--serif);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:inherit}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.topbar{border-bottom:1px solid var(--line);padding-inline:16px}
.topbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:14px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;flex-shrink:0;text-decoration:none}
.topbar b{font-family:var(--serif);font-size:20px}
main{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:36px 64px}
.card{background:var(--paper);border:1px solid var(--line2);border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:14px}
.card h1{font-size:30px}
.card p{margin:0;color:var(--ink2);max-width:60ch}
.state{align-self:flex-start;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--panel);color:var(--ink2)}
.state.ok{background:var(--ok-bg);color:var(--ok)}
.state.warn{background:var(--warn-bg);color:var(--warn)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.btn{font:inherit;font-size:14px;font-weight:600;padding:11px 18px;border-radius:12px;border:1px solid transparent;text-decoration:none;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-h)}
.btn-ghost{background:var(--paper);color:var(--accent);border-color:var(--line2)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:12.5px;color:var(--sub)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px;background:var(--panel);border-radius:16px;padding:12px 16px}
.kv dt{color:var(--sub)} .kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <a class="logo" href="../" aria-label="Torna a I miei viaggi"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></a>
  <b>I miei viaggi</b>
</div></div>

<main>
  <section class="card" id="card" aria-live="polite">
    <span class="state" id="state">Controllo il pagamento…</span>
    <div class="eyebrow" id="eyebrow">Acquisto itinerario</div>
    <h1 id="title">Un attimo…</h1>
    <p id="text">Sto verificando il pagamento con Stripe.</p>
    <dl class="kv" id="details" hidden></dl>
    <div class="actions" id="actions"></div>
    <p class="note" id="note"></p>
  </section>
</main>

<script src="../acquisto.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sid = new URLSearchParams(location.search).get('session_id') || '';

function show({state, cls = '', title, text, actions = '', note = '', details = null}){
  $('state').textContent = state; $('state').className = 'state ' + cls;
  $('title').textContent = title; $('text').textContent = text;
  $('actions').innerHTML = actions; $('note').textContent = note;
  $('details').hidden = !details;
  if(details) $('details').innerHTML = details.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
}

async function main(){
  if(!/^cs_(test|live)_/.test(sid)){
    return show({state: 'Nessun acquisto', title: 'Qui arrivi dopo un acquisto',
      text: 'Questa pagina si apre da sola dopo il pagamento di un itinerario. Se hai pagato e sei finito qui per errore, apri il link della ricevuta o scrivimi.',
      actions: '<a class="btn btn-ghost" href="../">Torna ai viaggi</a>'});
  }
  // Worker non ancora configurato: il PDF arriva per email (consegna a mano)
  if(!ACQUISTO.api){
    return show({state: 'Pagamento ricevuto', cls: 'ok', title: 'Grazie per l\'acquisto!',
      text: 'Ti mando il PDF dell\'itinerario all\'indirizzo email che hai usato per pagare, di solito entro poche ore. Ti arriva subito anche la ricevuta di Stripe.',
      actions: '<a class="btn btn-ghost" href="../">Torna ai viaggi</a>',
      note: `Codice dell'acquisto: ${sid.slice(0, 18)}…`});
  }
  let r;
  try{
    const res = await fetch(`${ACQUISTO.api}/session?session_id=${encodeURIComponent(sid)}`);
    r = await res.json();
    if(!res.ok) throw new Error(r.error || 'errore');
  }catch(e){
    return show({state: 'Non riesco a verificare', cls: 'warn', title: 'Il controllo del pagamento non è riuscito',
      text: 'Ricarica la pagina tra qualche secondo. Se il problema resta, scrivimi indicando l\'email usata per pagare: ti mando il PDF a mano.',
      actions: '<button class="btn btn-primary" type="button" onclick="location.reload()">Ricarica</button>'});
  }
  if(r.pagato && r.download){
    const tot = r.totale != null ? (r.totale / 100).toLocaleString('it-IT', {style: 'currency', currency: (r.valuta || 'eur').toUpperCase()}) : '';
    return show({state: 'Pagamento completato', cls: 'ok', title: 'Grazie, il tuo itinerario è pronto',
      text: 'Scarica il PDF e salvalo sul telefono: ogni posto si apre su Google Maps con un tocco. Il pulsante resta valido, quindi puoi tenere il link di questa pagina per scaricarlo di nuovo.',
      details: [['Itinerario', r.nome || r.itinerario], ...(tot ? [['Totale', tot]] : []), ...(r.email ? [['Email', r.email]] : [])],
      actions: `<a class="btn btn-primary" href="${esc(r.download)}">Scarica il PDF ↓</a><a class="btn btn-ghost" href="../${encodeURIComponent(r.itinerario || '')}/">Rivedi l'itinerario sul sito</a>`,
      note: 'Il PDF è per uso personale: grazie per non condividerlo.'});
  }
  if(r.stato === 'open'){
    return show({state: 'Pagamento non completato', cls: 'warn', title: 'Il pagamento non è andato a buon fine',
      text: 'Nessun addebito è stato fatto. Puoi riprovare dalla pagina dell\'itinerario.',
      actions: `<a class="btn btn-primary" href="../${encodeURIComponent(r.itinerario || '')}/">Riprova</a>`});
  }
  show({state: 'In elaborazione', cls: 'warn', title: 'Il pagamento è in elaborazione',
    text: 'Alcuni metodi di pagamento richiedono qualche minuto. Ricarica questa pagina tra poco per scaricare il PDF.',
    actions: '<button class="btn btn-primary" type="button" onclick="location.reload()">Ricarica</button>'});
}
main();
</script>
</body>
</html>
